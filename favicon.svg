<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>

  <!-- Subtle top-left highlight for depth -->
  <rect width="100" height="100" rx="22" ry="22"
        fill="url(#accent)" opacity="0.06"/>

  <!-- Accent bar — bottom edge, cyan -->
  <rect x="18" y="88" width="64" height="3.5" rx="2" fill="#06b6d4" opacity="0.85"/>

  <!-- Initials: J -->
  <text
    x="26"
    y="72"
    font-family="'Nunito', 'Segoe UI', Arial, sans-serif"
    font-size="52"
    font-weight="800"
    fill="url(#accent)"
    letter-spacing="-2"
  >JE</text>
</svg>
